<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}{% if page.title %} — {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<nav>
  <a class="home-link" href="{{ '/' | relative_url }}">Home</a>
  <div class="nav-right">
    <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} class="active"{% endif %}>Blog</a>
    <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' %} class="active"{% endif %}>Notes</a>
    <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} class="active"{% endif %}>Tags</a>
    <a href="{{ '/search/' | relative_url }}"{% if page.url contains '/search/' %} class="active"{% endif %}>Search</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>
</nav>

<main>
{{ content }}
</main>

<footer>
  <div class="socials">
    <a class="social-badge" href="https://arxiv.org/a/yourname" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#4A4A4A;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </span>
      <span>arXiv</span>
    </a>
    <a class="social-badge" href="https://github.com/hvardhann" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#1A1A1A;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.51-3.5-.7-3.72-1.34-.13-.32-.67-1.34-1.15-1.61-.39-.21-.95-.73-.01-.74.88-.01 1.51.82 1.72 1.16 1.01 1.72 2.62 1.24 3.26.94.1-.74.39-1.24.71-1.53-2.49-.29-5.1-1.27-5.1-5.63 0-1.24.44-2.27 1.16-3.07-.12-.29-.5-1.46.11-3.04 0 0 .95-.31 3.11 1.17a10.6 10.6 0 0 1 5.66 0c2.16-1.48 3.11-1.17 3.11-1.17.61 1.58.23 2.75.11 3.04.72.8 1.16 1.82 1.16 3.07 0 4.37-2.62 5.34-5.11 5.62.4.35.75 1.04.75 2.11 0 1.53-.01 2.75-.01 3.13 0 .27.18.59.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/></svg>
      </span>
      <span>GitHub</span>
    </a>
    <a class="social-badge" href="https://news.ycombinator.com/user?id=yourhandle" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#FF6600;">
        <span class="badge-letter">Y</span>
      </span>
      <span>Hacker News</span>
    </a>
    <a class="social-badge" href="https://lobste.rs/u/yourhandle" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#A62E1D;">
        <span class="badge-letter">L</span>
      </span>
      <span>lobste.rs</span>
    </a>
    <a class="social-badge" href="https://x.com/yourhandle" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#000;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff"><path d="M18.9 2H22l-7.6 8.7L23.3 22H16.7l-5.2-6.8L5.6 22H2.4l8.1-9.3L1.7 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.7L7.4 4H5.6l12.1 16Z"/></svg>
      </span>
      <span>X</span>
    </a>
    <a class="social-badge" href="https://codeforces.com/profile/yourhandle" target="_blank" rel="noopener">
      <span class="badge-icon" style="background:#1B3A5C;">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="13" width="4" height="7" rx="1" fill="#F0C419"/><rect x="10" y="8" width="4" height="12" rx="1" fill="#3B82F6"/><rect x="16" y="4" width="4" height="16" rx="1" fill="#E74C3C"/></svg>
      </span>
      <span>Codeforces</span>
    </a>
  </div>
  <span class="copyright">&copy; {{ site.time | date: '%Y' }}</span>
</footer>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>

</body>
</html>
