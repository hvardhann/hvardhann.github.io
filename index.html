{% assign recent = site.posts | slice: 0, 5 %}
{% if recent.size == 0 %}
<p class="empty">No posts yet.</p>
{% endif %}
{% for post in recent %}
<a class="list-item" href="{{ post.url | relative_url }}">
  <span class="list-title">{{ post.title }}</span>
  <span class="list-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
</a>
{% endfor %}
