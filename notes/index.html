---
layout: default
title: Notes
permalink: /notes/
---
{% assign items = site.notes | sort: "title" %}
{% if items.size == 0 %}
<p class="empty">No notes yet.</p>
{% endif %}
{% for note in items %}
<a class="list-item" href="{{ note.url | relative_url }}">
  <span class="list-title">{{ note.title }}</span>
</a>
{% endfor %}
